spring.application.name=docs-similarity
server.port=8080

# Uploads (multipart/form-data). Documents are also checked against the character limits below.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Browser origins allowed to call the API (the Vite dev server).
docs-similarity.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Input limits
docs-similarity.limits.max-documents=20
docs-similarity.limits.max-document-chars=500000
docs-similarity.limits.max-total-chars=2000000

# Minimum length L (in characters) of a common segment, and the range a client may request.
docs-similarity.analysis.default-min-match-length=25
docs-similarity.analysis.min-allowed-match-length=3
docs-similarity.analysis.max-allowed-match-length=1000
# How many of the longest segments are returned per pair, and how many characters of each.
docs-similarity.analysis.max-segments-per-pair=50
docs-similarity.analysis.segment-preview-chars=400
# Recent analyses kept in memory for the paged Suffix Array view.
docs-similarity.analysis.stored-analyses=5

# Folder with the sample .txt files, relative to the directory the backend is started from.
docs-similarity.samples-dir=../sample-documents
