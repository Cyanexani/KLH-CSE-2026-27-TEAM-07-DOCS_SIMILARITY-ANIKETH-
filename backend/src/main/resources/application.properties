spring.application.name=docs-similarity
server.port=8080

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
# Let Tomcat read (and discard) an oversized upload so the client receives the
# 413 JSON error instead of a reset connection.
server.tomcat.max-swallow-size=-1

logging.level.com.docs_similarity=INFO
